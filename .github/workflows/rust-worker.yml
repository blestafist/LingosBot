name: Rust worker

on:
  push:
    paths: ['worker-server-rust/**', '.github/workflows/rust-worker.yml']
    tags: ['worker-v*']
  pull_request:
    paths: ['worker-server-rust/**', '.github/workflows/rust-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: worker-server-rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  release:
    if: startsWith(github.ref, 'refs/tags/worker-v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check version matches release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$TAG" = "worker-v$VERSION"
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/lingosbot" "dist/lingosbot-$TARGET"
          cd dist
          sha256sum "lingosbot-$TARGET" > "lingosbot-$TARGET.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: worker-server-rust/dist/*
