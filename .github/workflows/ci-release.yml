name: CI and release

# Every push to any branch and every pull request: tests and builds of all
# artifacts, never publishing. Pushing a tag v* (or running the workflow
# manually on a tag) additionally creates a DRAFT release using
# Docs/releases/<tag>.md, falling back to the tagged commit message.
# Publishing stays a manual step in the GitHub UI.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: worker-server-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test worker-desktop/LingosBot.Tests/LingosBot.Tests.csproj -c Release

  test-webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: docker-webui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check frontend scripts
        run: |
          for SCRIPT in internal/webui/web/static/*.js; do
            node --check "$SCRIPT"
          done
          node --test internal/webui/web/static/*.test.js

  build-webui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            elf-machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
            elf-machine: AArch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: docker-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: docker-webui/go.sum
      - name: Build static WebUI with embedded assets
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/lingos-webui-linux-$ARCH" .
      - name: Verify ELF, configuration guard and checksum
        env:
          ARCH: ${{ matrix.arch }}
          ELF_MACHINE: ${{ matrix.elf-machine }}
          LC_ALL: C
        run: |
          BINARY="dist/lingos-webui-linux-$ARCH"
          MACHINE=$(readelf -h "$BINARY" | sed -n 's/^ *Machine: *//p')
          test "$MACHINE" = "$ELF_MACHINE"
          HEADERS=$(readelf -l "$BINARY")
          DYNAMIC=$(readelf -d "$BINARY")
          if grep -q 'INTERP' <<< "$HEADERS" || grep -q '(NEEDED)' <<< "$DYNAMIC"; then
            echo 'Expected a static binary without INTERP or NEEDED' >&2
            exit 1
          fi
          if OUTPUT=$(env -i "$BINARY" 2>&1); then
            echo 'Expected startup without an encryption key to fail' >&2
            exit 1
          fi
          grep -Fq 'ENCRYPTION_KEY must be base64 for exactly 32 bytes' <<< "$OUTPUT"
          cd dist
          sha256sum "lingos-webui-linux-$ARCH" > "lingos-webui-linux-$ARCH.sha256"
          sha256sum -c "lingos-webui-linux-$ARCH.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: webui-linux-${{ matrix.arch }}
          path: docker-webui/dist/*
          if-no-files-found: error

  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            elf-machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            elf-machine: AArch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: worker-server-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - name: Stamp the tag version into the binary
        # `lingosbot --version` must match the release tag (v1.6.0 -> 1.6.0).
        # Done in the CI checkout only; Cargo.toml in the repository is untouched.
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; v=json.load(sys.stdin)["packages"][0]["version"]; assert v == sys.argv[1], v' "$VERSION"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify ELF and native CLI smoke
        env:
          TARGET: ${{ matrix.target }}
          ELF_MACHINE: ${{ matrix.elf-machine }}
          LC_ALL: C
        run: |
          BINARY="target/$TARGET/release/lingosbot"
          MACHINE=$(readelf -h "$BINARY" | sed -n 's/^ *Machine: *//p')
          test "$MACHINE" = "$ELF_MACHINE"
          HEADERS=$(readelf -l "$BINARY")
          DYNAMIC=$(readelf -d "$BINARY")
          if grep -q 'INTERP' <<< "$HEADERS" || grep -q '(NEEDED)' <<< "$DYNAMIC"; then
            echo 'Expected a static binary without INTERP or NEEDED' >&2
            exit 1
          fi
          "$BINARY" --version
          "$BINARY" --help
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$("$BINARY" --version)" = "lingosbot ${GITHUB_REF_NAME#v}"
          fi
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/lingosbot" "dist/lingosbot-$TARGET"
          cd dist
          sha256sum "lingosbot-$TARGET" > "lingosbot-$TARGET.sha256"
          sha256sum -c "lingosbot-$TARGET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: worker-server-rust/dist/*
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: win-x64
            app: LingosBot.exe
            manager: selenium-manager.exe
          - rid: linux-x64
            asset: linux-x64
            app: LingosBot
            manager: selenium-manager
          - rid: osx-x64
            asset: macos-x86_64
            app: LingosBot
            manager: selenium-manager
          - rid: osx-arm64
            asset: macos-arm64
            app: LingosBot
            manager: selenium-manager
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Publish self-contained single file
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish worker-desktop/LingosBot.csproj \
            -c Release -r "$RID" --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -o "publish/$RID"
      - name: Verify, archive and checksum
        env:
          RID: ${{ matrix.rid }}
          ASSET: ${{ matrix.asset }}
          APP: ${{ matrix.app }}
          MANAGER: ${{ matrix.manager }}
        run: |
          OUT="publish/$RID"
          test -s "$OUT/$APP"
          test -s "$OUT/$MANAGER"
          if [[ "$RID" != win-x64 ]]; then
            chmod +x "$OUT/$APP" "$OUT/$MANAGER"
          fi
          mkdir -p dist
          (cd "$OUT" && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/$ASSET.zip" "$APP" "$MANAGER")
          7z t "dist/$ASSET.zip"
          LISTING=$(7z l -ba -slt "dist/$ASSET.zip" | sed -n 's/^Path = //p' | sort)
          test "$LISTING" = "$(printf '%s\n%s\n' "$APP" "$MANAGER" | sort)"
          cd dist
          sha256sum "$ASSET.zip" > "$ASSET.zip.sha256"
          sha256sum -c "$ASSET.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    # Only tags v*. Branch pushes, PRs and manual runs on branches stop above.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [test-rust, test-desktop, test-webui, build-rust, build-desktop, build-webui]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points at a commit that is not in main; refusing to draft a release." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Verify complete release assets
        working-directory: dist
        run: |
          for FILE in \
            lingosbot-x86_64-unknown-linux-musl \
            lingosbot-aarch64-unknown-linux-musl \
            lingos-webui-linux-amd64 lingos-webui-linux-arm64 \
            win-x64.zip linux-x64.zip macos-x86_64.zip macos-arm64.zip; do
            test -s "$FILE"
            test -s "$FILE.sha256"
            sha256sum -c "$FILE.sha256"
          done
          test "$(ls | wc -l)" -eq 16
      - name: Create or refresh the draft release
        run: |
          STATE=$(gh release list --limit 200 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$TAG\") | .isDraft")
          case "$STATE" in
            true)
              # Keep the notes the maintainer may already have edited.
              gh release upload "$TAG" dist/* --clobber
              ;;
            false)
              echo "Release $TAG is already published; refusing to modify it." >&2
              exit 1
              ;;
            *)
              if [[ -f "Docs/releases/$TAG.md" ]]; then
                cp "Docs/releases/$TAG.md" notes.md
              else
                git log -1 --format=%B "$GITHUB_SHA" > notes.md
              fi
              FLAGS=(--draft --verify-tag --title "$TAG" --notes-file notes.md)
              if [[ "$TAG" =~ -([Aa]lpha|[Bb]eta|[Rr][Cc]|[Pp]re) ]]; then
                FLAGS+=(--prerelease)
              fi
              gh release create "$TAG" dist/* "${FLAGS[@]}"
              ;;
          esac
