[package]
name = "worker-server-rust"
version = "0.1.0"
edition = "2024"
description = "Small, fail-closed Lingos HTTP lesson worker"

[[bin]]
name = "lingosbot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "env"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "json", "blocking"] }
tl = "0.7.8"
html-escape = "0.2.13"
fastrand = "2.3"
unicode-normalization = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
