services:
  webui:
    build:
      context: ..
      dockerfile: docker-webui/Dockerfile
      # Resolve moving channels on EVERY build, even when the Dockerfile is cached.
      # Update: docker compose -f docker-webui/docker-compose.yml up -d --build
      # Pinned restarts are offline; Go rechecks channels and reuses unchanged workers.
      no_cache: true
      args:
        RELEASE_VERSION: ${RELEASE_VERSION:-latest} # v... | latest | latest-prerelease
    environment:
      # Go manages only the persistent worker at startup; WebUI updates need --build.
      RELEASE_VERSION: ${RELEASE_VERSION:-latest}
      LISTEN: :8080
      DB_PATH: /data/webui.db
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY to base64 of 32 random bytes}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WORKER_BASE_URL: ${WORKER_BASE_URL:-https://lingos.pl}
      WORKER_DASHBOARD_URL: ${WORKER_DASHBOARD_URL:-/student/dashboard}
      WORKER_MAX_RUN_SECONDS: ${WORKER_MAX_RUN_SECONDS:-3600}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - webui-data:/data
volumes:
  webui-data:
