name: CI and release

# Every push to any branch and every pull request: tests and builds of all
# artifacts, never publishing. Pushing a tag v* (or running the workflow
# manually on a tag) additionally publishes a versioned GHCR image and creates a DRAFT release using
# Docs/releases/<tag>.md, falling back to the tagged commit message.
# Publishing stays a manual step in the GitHub UI.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s deploy/tests -v

  test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: worker-server-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test worker-desktop/LingosBot.Tests/LingosBot.Tests.csproj -c Release

  test-webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: docker-webui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check frontend scripts
        run: |
          for SCRIPT in internal/webui/web/static/*.js; do
            node --check "$SCRIPT"
          done
          node --test internal/webui/web/static/*.test.js

  build-webui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            asset: lingosbot-webui-linux-x64
            elf-machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            arch: arm64
            asset: lingosbot-webui-linux-arm64
            elf-machine: AArch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: docker-webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: docker-webui/go.sum
      - name: Build static WebUI with embedded assets
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/$ASSET" .
      - name: Verify ELF, configuration guard and checksum
        env:
          ASSET: ${{ matrix.asset }}
          ELF_MACHINE: ${{ matrix.elf-machine }}
          LC_ALL: C
        run: |
          BINARY="dist/$ASSET"
          MACHINE=$(readelf -h "$BINARY" | sed -n 's/^ *Machine: *//p')
          test "$MACHINE" = "$ELF_MACHINE"
          HEADERS=$(readelf -l "$BINARY")
          DYNAMIC=$(readelf -d "$BINARY")
          if grep -q 'INTERP' <<< "$HEADERS" || grep -q '(NEEDED)' <<< "$DYNAMIC"; then
            echo 'Expected a static binary without INTERP or NEEDED' >&2
            exit 1
          fi
          if OUTPUT=$(env -i "$BINARY" 2>&1); then
            echo 'Expected startup without an encryption key to fail' >&2
            exit 1
          fi
          grep -Fq 'ENCRYPTION_KEY must be base64 for exactly 32 bytes' <<< "$OUTPUT"
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: webui-linux-${{ matrix.arch }}
          path: docker-webui/dist/*
          if-no-files-found: error

  build-rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: lingosbot-worker-linux-x64
            elf-machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: lingosbot-worker-linux-arm64
            elf-machine: AArch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: worker-server-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - name: Stamp the tag version into the binary
        # `lingosbot --version` must match the release tag (v1.6.0 -> 1.6.0).
        # Done in the CI checkout only; Cargo.toml in the repository is untouched.
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; v=json.load(sys.stdin)["packages"][0]["version"]; assert v == sys.argv[1], v' "$VERSION"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify ELF and native CLI smoke
        env:
          TARGET: ${{ matrix.target }}
          ELF_MACHINE: ${{ matrix.elf-machine }}
          LC_ALL: C
        run: |
          BINARY="target/$TARGET/release/lingosbot"
          MACHINE=$(readelf -h "$BINARY" | sed -n 's/^ *Machine: *//p')
          test "$MACHINE" = "$ELF_MACHINE"
          HEADERS=$(readelf -l "$BINARY")
          DYNAMIC=$(readelf -d "$BINARY")
          if grep -q 'INTERP' <<< "$HEADERS" || grep -q '(NEEDED)' <<< "$DYNAMIC"; then
            echo 'Expected a static binary without INTERP or NEEDED' >&2
            exit 1
          fi
          "$BINARY" --version
          "$BINARY" --help
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$("$BINARY" --version)" = "lingosbot ${GITHUB_REF_NAME#v}"
          fi
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/lingosbot" "dist/$ASSET"
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: worker-server-rust/dist/*
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            asset: lingosbot-desktop-windows-x64
            app: LingosBot.exe
            manager: selenium-manager.exe
          - rid: linux-x64
            asset: lingosbot-desktop-linux-x64
            app: LingosBot
            manager: selenium-manager
          - rid: osx-x64
            asset: lingosbot-desktop-macos-x64
            app: LingosBot
            manager: selenium-manager
          - rid: osx-arm64
            asset: lingosbot-desktop-macos-arm64
            app: LingosBot
            manager: selenium-manager
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Publish self-contained single file
        env:
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish worker-desktop/LingosBot.csproj \
            -c Release -r "$RID" --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -o "publish/$RID"
      - name: Verify, archive and checksum
        env:
          RID: ${{ matrix.rid }}
          ASSET: ${{ matrix.asset }}
          APP: ${{ matrix.app }}
          MANAGER: ${{ matrix.manager }}
        run: |
          OUT="publish/$RID"
          test -s "$OUT/$APP"
          test -s "$OUT/$MANAGER"
          if [[ "$RID" != win-x64 ]]; then
            chmod +x "$OUT/$APP" "$OUT/$MANAGER"
          fi
          mkdir -p dist
          (cd "$OUT" && 7z a -tzip -mx=9 "$GITHUB_WORKSPACE/dist/$ASSET.zip" "$APP" "$MANAGER")
          7z t "dist/$ASSET.zip"
          LISTING=$(7z l -ba -slt "dist/$ASSET.zip" | sed -n 's/^Path = //p' | sort)
          test "$LISTING" = "$(printf '%s\n%s\n' "$APP" "$MANAGER" | sort)"
          cd dist
          sha256sum "$ASSET.zip" > "$ASSET.zip.sha256"
          sha256sum -c "$ASSET.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    # Only tags v*. Branch pushes, PRs and manual runs on branches stop above.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [test-deploy, test-rust, test-desktop, test-webui, build-rust, build-desktop, build-webui]
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG points at a commit that is not in main; refusing to draft a release." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist
      - name: Verify complete release assets
        working-directory: dist
        run: |
          for FILE in \
            lingosbot-worker-linux-x64 lingosbot-worker-linux-arm64 \
            lingosbot-webui-linux-x64 lingosbot-webui-linux-arm64 \
            lingosbot-desktop-windows-x64.zip lingosbot-desktop-linux-x64.zip \
            lingosbot-desktop-macos-x64.zip lingosbot-desktop-macos-arm64.zip; do
            test -s "$FILE"
            test -s "$FILE.sha256"
            sha256sum -c "$FILE.sha256"
          done
          test "$(ls | wc -l)" -eq 16
      - name: Create or refresh the draft release
        run: |
          STATE=$(gh release list --limit 200 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"$TAG\") | .isDraft")
          case "$STATE" in
            true)
              # Keep the notes the maintainer may already have edited.
              gh release upload "$TAG" dist/* --clobber
              ;;
            false)
              echo "Release $TAG is already published; refusing to modify it." >&2
              exit 1
              ;;
            *)
              if [[ -f "Docs/releases/$TAG.md" ]]; then
                cp "Docs/releases/$TAG.md" notes.md
              else
                git log -1 --format=%B "$GITHUB_SHA" > notes.md
              fi
              FLAGS=(--draft --verify-tag --title "$TAG" --notes-file notes.md)
              if [[ "$TAG" =~ -([Aa]lpha|[Bb]eta|[Rr][Cc]|[Pp]re) ]]; then
                FLAGS+=(--prerelease)
              fi
              gh release create "$TAG" dist/* "${FLAGS[@]}"
              ;;
          esac

  publish-container:
    needs: draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '{webui-linux-*,server-*-unknown-linux-musl}'
          merge-multiple: true
          path: dist
      - name: Verify and stage the CI binaries
        working-directory: dist
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ && ${#TAG} -le 128 ]]
          for arch in amd64 arm64; do
            suffix=$arch
            [[ "$arch" != amd64 ]] || suffix=x64
            worker="lingosbot-worker-linux-$suffix"
            webui="lingosbot-webui-linux-$suffix"
            sha256sum --strict -c "$worker.sha256" "$webui.sha256"
            dir="seed/release/$arch"
            install -D -m 0755 "$worker" "$dir/lingosbot"
            install -m 0755 "$webui" "$dir/webui"
            prerelease=false
            [[ "$TAG" != *-* ]] || prerelease=true
            printf '{"tag":"%s","sha256":"%s","architecture":"%s","prerelease":%s}\n' \
              "$TAG" "$(sha256sum "$dir/lingosbot" | cut -d' ' -f1)" "$arch" "$prerelease" > "$dir/worker-release.json"
          done
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Smoke test each platform without GitHub Releases access
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load --tag "lingosbot-smoke:$arch" \
              --build-arg RELEASE_VERSION="$TAG" --build-context download=dist/seed -f docker-webui/Dockerfile .
            docker run --rm --platform "linux/$arch" --network none --entrypoint sh "lingosbot-smoke:$arch" -ec '
              export ADMIN_USER=smoke ADMIN_PASSWORD=temporary-smoke-password
              export ENCRYPTION_KEY=$(head -c32 /dev/urandom | base64)
              webui & pid=$!
              trap "kill $pid; wait $pid || true" EXIT
              for i in $(seq 1 60); do
                if wget -qO /dev/null http://127.0.0.1:8080/; then break; fi
                kill -0 "$pid"
                sleep 1
              done
              wget -qO /dev/null http://127.0.0.1:8080/
              test "$(.data/lingosbot --version)" = "lingosbot ${RELEASE_VERSION#v}"
            '
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the versioned image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-webui"
          docker buildx build --platform linux/amd64,linux/arm64 --push --tag "$image:$TAG" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$TAG" \
            --build-arg RELEASE_VERSION="$TAG" --build-context download=dist/seed -f docker-webui/Dockerfile .
          docker buildx imagetools inspect "$image:$TAG"
