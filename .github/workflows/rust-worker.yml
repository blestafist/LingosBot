name: Rust worker

on:
  push:
    branches: ['**']
    paths: ['worker-server-rust/**', '.github/workflows/rust-worker.yml']
    tags: ['worker-v*']
  pull_request:
    paths: ['worker-server-rust/**', '.github/workflows/rust-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: worker-server-rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - name: Check version matches release tag
        if: startsWith(github.ref, 'refs/tags/worker-v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "worker-server-rust"))')
          test "$TAG" = "worker-v$VERSION"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            elf-machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            elf-machine: AArch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker-server-rust
      - run: sudo apt-get update && sudo apt-get install -y musl-tools binutils
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify ELF and native CLI smoke
        env:
          TARGET: ${{ matrix.target }}
          ELF_MACHINE: ${{ matrix.elf-machine }}
          LC_ALL: C
        run: |
          BINARY="target/$TARGET/release/lingosbot"
          MACHINE=$(readelf -h "$BINARY" | sed -n 's/^ *Machine: *//p')
          test "$MACHINE" = "$ELF_MACHINE"
          HEADERS=$(readelf -l "$BINARY")
          DYNAMIC=$(readelf -d "$BINARY")
          if grep -q 'INTERP' <<< "$HEADERS" || grep -q '(NEEDED)' <<< "$DYNAMIC"; then
            echo 'Expected a static binary without INTERP or NEEDED' >&2
            exit 1
          fi
          "$BINARY" --version
          "$BINARY" --help
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/lingosbot" "dist/lingosbot-$TARGET"
          cd dist
          sha256sum "lingosbot-$TARGET" > "lingosbot-$TARGET.sha256"
          sha256sum -c "lingosbot-$TARGET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lingosbot-${{ matrix.target }}
          path: worker-server-rust/dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/worker-v')
    needs: [test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: rust-worker-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lingosbot-*
          merge-multiple: true
          path: worker-server-rust/dist
      - name: Verify complete release assets
        run: |
          cd dist
          for TARGET in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            test -s "lingosbot-$TARGET"
            test -s "lingosbot-$TARGET.sha256"
            sha256sum -c "lingosbot-$TARGET.sha256"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: worker-server-rust/dist/*
          fail_on_unmatched_files: true
          draft: true
      - name: Publish only after all assets were uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest=false
